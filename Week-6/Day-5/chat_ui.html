<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AFL Assistant</title>
<style>
  :root {
    --afl-navy: #142a4f;
    --afl-gold: #c9a24b;
    --bg: #f5f6f8;
    --bubble-user: #142a4f;
    --bubble-bot: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    display: flex;
    justify-content: center;
    height: 100vh;
  }
  #app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: #fff;
    box-shadow: 0 0 24px rgba(0,0,0,0.06);
  }
  header {
    background: var(--afl-navy);
    color: #fff;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: 0.02em; }
  header .sub { font-size: 12px; color: var(--afl-gold); margin-top: 2px; }
  header button {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.4);
    color: #fff;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
  }
  .row.user .bubble { background: var(--bubble-user); color: #fff; border-bottom-right-radius: 4px; }
  .row.bot .bubble { background: var(--bubble-bot); border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; }
  .meta {
    font-size: 11px;
    color: #9aa1ab;
    margin-top: 4px;
    padding-left: 2px;
  }
  .badge {
    display: inline-block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 2px 6px;
    border-radius: 10px;
    margin-right: 6px;
    background: #eef1f5;
    color: #46505e;
  }
  .badge.prediction { background: #fdf3e0; color: #8a6416; }
  .badge.retrieval { background: #e6f0fb; color: #1e4f8a; }
  .badge.off_topic { background: #fbe9e9; color: #9a3030; }
  .badge.factual { background: #eaf6ea; color: #2f6b34; }
  #inputbar {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid #eee;
  }
  #inputbar input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid #d8dce2;
    font-size: 14px;
    outline: none;
  }
  #inputbar input:focus { border-color: var(--afl-navy); }
  #inputbar button {
    background: var(--afl-navy);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
  }
  #inputbar button:disabled { opacity: 0.5; cursor: default; }
  .typing { font-size: 13px; color: #9aa1ab; padding-left: 2px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>AFL Assistant</h1>
      <div class="sub">stats &middot; predictions &middot; AFL only</div>
    </div>
    <button onclick="resetChat()">New chat</button>
  </header>
  <div id="messages"></div>
  <div id="inputbar">
    <input id="msgInput" type="text" placeholder="Ask about a stat, a matchup, or a prediction..."
           onkeydown="if(event.key==='Enter') sendMessage()">
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
// Point this at wherever api.py is actually running.
const API_BASE = "http://localhost:8000";

let conversationId = null;

const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");

function addBubble(role, text, meta) {
  const row = document.createElement("div");
  row.className = "row " + (role === "user" ? "user" : "bot");
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  row.appendChild(bubble);
  messagesEl.appendChild(row);

  if (meta) {
    const metaEl = document.createElement("div");
    metaEl.className = "meta";
    const badgeClass = (meta.intent || "").toLowerCase();
    metaEl.innerHTML =
      `<span class="badge ${badgeClass}">${meta.intent || "?"}${meta.sub_type ? " / " + meta.sub_type : ""}</span>` +
      `${meta.latency_ms ? meta.latency_ms.toFixed(0) + " ms" : ""}`;
    messagesEl.appendChild(metaEl);
  }
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addTyping() {
  const el = document.createElement("div");
  el.className = "typing";
  el.id = "typingIndicator";
  el.textContent = "Thinking...";
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById("typingIndicator");
  if (el) el.remove();
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  sendBtn.disabled = true;
  addBubble("user", text);
  addTyping();

  try {
    const res = await fetch(`${API_BASE}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, conversation_id: conversationId }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    conversationId = data.conversation_id;
    removeTyping();
    addBubble("bot", data.response, { intent: data.intent, sub_type: data.sub_type, latency_ms: data.latency_ms });
  } catch (err) {
    removeTyping();
    addBubble("bot", "Something went wrong reaching the assistant: " + err.message);
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

async function resetChat() {
  if (conversationId) {
    try { await fetch(`${API_BASE}/chat/${conversationId}`, { method: "DELETE" }); } catch (e) {}
  }
  conversationId = null;
  messagesEl.innerHTML = "";
  addBubble("bot", "New conversation started. Ask me about an AFL stat, matchup, or prediction.");
}

resetChat();
</script>
</body>
</html>
