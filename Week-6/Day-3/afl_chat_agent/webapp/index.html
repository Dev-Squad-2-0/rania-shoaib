<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Boundary — AFL Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<style>
  :root{
    --navy:#0F2A47;
    --blue:#1D5FB8;
    --blue-bright:#2E7BE0;
    --panel:#EAF1FB;
    --white:#FFFFFF;
    --ink:#10192B;
    --ink-soft:#4A5A72;
    --line:#C9D6E8;
    --leather:#8B4A2B;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;color:var(--ink);background:var(--white);}
  h1,h2,.wordmark{font-family:'Anton',sans-serif;letter-spacing:.02em;font-weight:400;}
  .mono{font-family:'Space Mono',monospace;}

  /* ---------- header ---------- */
  header{background:var(--navy);color:var(--white);}
  .header-inner{max-width:1180px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;gap:14px;}
  .wordmark{font-size:26px;color:var(--white);}
  .tagline{font-size:13px;color:#9FC0E8;margin-top:-2px;}

  /* logo/avatar image + fallback handling — see assets/README.md */
  .logo-slot, .avatar-icon-wrap{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .brand-logo{width:40px;height:40px;object-fit:contain;border-radius:6px;}
  .avatar-img{width:30px;height:30px;object-fit:cover;border-radius:50%;}
  .msg.bot .avatar-row .avatar-img{width:20px;height:20px;}

  /* ---------- team strip (real crests if present, colored chip fallback otherwise) ---------- */
  .team-strip{background:var(--panel);border-bottom:1px solid var(--line);border-top:1px solid var(--line);overflow-x:auto;}
  .team-strip-inner{max-width:1180px;margin:0 auto;display:flex;gap:10px;padding:10px 24px;}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--ink-soft);white-space:nowrap;}
  .dot{width:9px;height:9px;border-radius:2px;display:inline-block;}
  .team-logo-img{width:20px;height:20px;object-fit:contain;border-radius:4px;}

  /* ---------- hero ---------- */
  main{max-width:1180px;margin:0 auto;padding:40px 24px 60px;}
  .hero{display:grid;grid-template-columns:1.1fr 0.9fr;gap:40px;align-items:center;margin-bottom:36px;}
  .hero h1{font-size:44px;line-height:1.05;color:var(--navy);margin:0 0 14px;}
  .hero h1 span{color:var(--blue);}
  .hero p{color:var(--ink-soft);font-size:16px;line-height:1.55;max-width:46ch;margin:0 0 20px;}
  .quick-prompts{display:flex;flex-wrap:wrap;gap:8px;}
  .qp-btn{background:var(--white);border:1.5px solid var(--blue);color:var(--blue);font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s;}
  .qp-btn:hover{background:var(--blue);color:var(--white);}

  /* ---------- mascot illustration (original, not a real club mascot) ---------- */
  .mascot-wrap{display:flex;justify-content:center;}
  .mascot-wrap svg{width:100%;max-width:300px;height:auto;}
  .hero-photo{width:100%;max-width:340px;height:auto;border-radius:14px;box-shadow:0 12px 28px rgba(15,42,71,.22);object-fit:cover;}

  /* ---------- chat panel ---------- */
  .chat-shell{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .chat-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--navy);color:var(--white);}
  .chat-header .title{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;}
  .bot-avatar{width:30px;height:30px;flex:0 0 auto;}
  .debug-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:#9FC0E8;cursor:pointer;user-select:none;}
  .debug-toggle input{accent-color:var(--blue-bright);}

  .messages{height:420px;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;background:var(--white);}

  /* ---------- walking mascot easter egg — lives in its own lane so it can
     never overlap message bubbles, however long the conversation gets ---------- */
  .mascot-lane{position:relative;height:60px;overflow:hidden;background:var(--panel);border-top:1px solid var(--line);}
  .mascot-visitor{position:absolute;bottom:4px;left:0;height:52px;width:52px;pointer-events:none;z-index:2;animation:mascot-walk 16s ease-in-out infinite;}
  .mascot-visitor svg{width:100%;height:100%;display:block;}
  @keyframes mascot-walk{
    0%   { left:0;     transform:scaleX(1) translateY(0); }
    4%   { left:8.6%;  transform:scaleX(1) translateY(-4px); }
    8%   { left:17.3%; transform:scaleX(1) translateY(0); }
    12%  { left:26%;   transform:scaleX(1) translateY(-4px); }
    16%  { left:34.6%; transform:scaleX(1) translateY(0); }
    20%  { left:43.3%; transform:scaleX(1) translateY(-4px); }
    24%  { left:52%;   transform:scaleX(1) translateY(0); }
    28%  { left:60.6%; transform:scaleX(1) translateY(-4px); }
    32%  { left:69.3%; transform:scaleX(1) translateY(0); }
    36%  { left:78%;   transform:scaleX(1) translateY(-4px); }
    40%  { left:78%;   transform:scaleX(1) translateY(0); }
    44%  { left:78%;   transform:scaleX(-1) translateY(0); }
    48%  { left:69.3%; transform:scaleX(-1) translateY(-4px); }
    52%  { left:60.6%; transform:scaleX(-1) translateY(0); }
    56%  { left:52%;   transform:scaleX(-1) translateY(-4px); }
    60%  { left:43.3%; transform:scaleX(-1) translateY(0); }
    64%  { left:34.6%; transform:scaleX(-1) translateY(-4px); }
    68%  { left:26%;   transform:scaleX(-1) translateY(0); }
    72%  { left:17.3%; transform:scaleX(-1) translateY(-4px); }
    76%  { left:8.6%;  transform:scaleX(-1) translateY(0); }
    80%  { left:0;     transform:scaleX(-1) translateY(-4px); }
    84%  { left:0;     transform:scaleX(-1) translateY(0); }
    88%  { left:0;     transform:scaleX(1) translateY(0); }
    100% { left:0;     transform:scaleX(1) translateY(0); }
  }
  .mascot-visitor.disintegrate .mascot-eyes{animation:mascot-eyes-fall .6s ease-in forwards;}
  .mascot-visitor.disintegrate .mascot-boots{animation:mascot-boots-fall .6s ease-in forwards .1s;}
  .mascot-visitor.disintegrate .mascot-body{animation:mascot-body-fade .5s ease-in forwards .35s;}
  @keyframes mascot-eyes-fall{ to { transform:translateY(40px); opacity:0; } }
  @keyframes mascot-boots-fall{ to { transform:translateY(50px) rotate(25deg); opacity:0; } }
  @keyframes mascot-body-fade{ to { transform:translateY(14px) scale(.82); opacity:0; } }
  .msg{max-width:78%;padding:11px 14px;border-radius:10px;font-size:14.5px;line-height:1.5;}
  .msg.user{align-self:flex-end;background:var(--blue);color:var(--white);border-bottom-right-radius:2px;}
  .msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:2px;}
  .msg.bot .avatar-row{display:flex;align-items:center;gap:7px;margin-bottom:6px;}
  .msg.bot .avatar-row svg{width:20px;height:20px;}
  .msg.bot .avatar-row span.label{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.05em;}
  .msg.error{background:#FBEAEA;border:1px solid #E3A6A6;color:#7A2020;}
  .tool-trace{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-soft);white-space:pre-wrap;word-break:break-word;}

  /* rendered markdown inside bot bubbles */
  .msg-body p{margin:0 0 8px;}
  .msg-body p:last-child{margin-bottom:0;}
  .msg-body ul,.msg-body ol{margin:0 0 8px;padding-left:20px;}
  .msg-body li{margin-bottom:3px;}
  .msg-body strong{color:var(--navy);}
  .msg-body code{background:var(--white);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-family:'Space Mono',monospace;font-size:12.5px;}
  .msg-body table{border-collapse:collapse;width:100%;margin:6px 0 10px;font-size:13.5px;}
  .msg-body th,.msg-body td{border:1px solid var(--line);padding:6px 10px;text-align:left;}
  .msg-body th{background:var(--navy);color:var(--white);font-weight:600;}
  .msg-body tr:nth-child(even) td{background:var(--white);}
  .msg.user .msg-body table{font-size:13px;}
  .msg.user .msg-body th,.msg.user .msg-body td{border-color:rgba(255,255,255,.35);}

  .composer{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line);background:var(--panel);}
  .composer input{flex:1;padding:11px 14px;border:1.5px solid var(--line);border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;background:var(--white);color:var(--ink);}
  .composer input:focus{outline:none;border-color:var(--blue);}
  .send-btn{background:var(--blue);color:var(--white);border:none;border-radius:8px;padding:0 20px;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .send-btn:hover{background:var(--blue-bright);}
  .send-btn:disabled{opacity:.5;cursor:default;}
  .send-btn svg{width:16px;height:16px;transition:transform .25s;}
  .send-btn.kicking svg{transform:translateX(4px) rotate(25deg);}

  .status{font-size:12px;color:var(--ink-soft);padding:0 24px 8px;}
  .status.offline{color:#B23A3A;}

  /* ---------- animated mascot avatar (chat header + per-message) ---------- */
  @keyframes mascot-bob{
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25%      { transform: translateY(-2px) rotate(-8deg); }
    50%      { transform: translateY(0) rotate(0deg); }
    75%      { transform: translateY(-2px) rotate(8deg); }
  }
  .avatar-icon-wrap svg{
    animation: mascot-bob 2.4s ease-in-out infinite;
    transform-origin: 50% 85%;
  }

  @media (max-width:860px){
    .hero{grid-template-columns:1fr;}
    .mascot-wrap{order:-1;max-width:180px;margin:0 auto;}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <span class="logo-slot">
      <svg class="mascot-wrap-icon" width="40" height="40" viewBox="0 0 100 100" aria-hidden="true">
        <ellipse cx="50" cy="55" rx="34" ry="26" fill="#FFFFFF"/>
        <ellipse cx="50" cy="55" rx="34" ry="26" fill="none" stroke="#0F2A47" stroke-width="4"/>
        <line x1="20" y1="55" x2="80" y2="55" stroke="#0F2A47" stroke-width="3"/>
        <line x1="32" y1="49" x2="32" y2="61" stroke="#0F2A47" stroke-width="3"/>
        <line x1="45" y1="47" x2="45" y2="63" stroke="#0F2A47" stroke-width="3"/>
        <line x1="55" y1="47" x2="55" y2="63" stroke="#0F2A47" stroke-width="3"/>
        <line x1="68" y1="49" x2="68" y2="61" stroke="#0F2A47" stroke-width="3"/>
        <circle cx="40" cy="45" r="3.2" fill="#0F2A47"/>
        <circle cx="60" cy="45" r="3.2" fill="#0F2A47"/>
      </svg>
      <!-- Drop your own official logo file at assets/logo.png and it will
           automatically replace the mark above — see assets/README.md -->
      <img class="brand-logo" src="assets/logo.png" alt="Boundary logo" style="display:none"
           onload="this.style.display='inline-block'; this.previousElementSibling.style.display='none';"
           onerror="this.remove();" />
    </span>
    <div>
      <div class="wordmark">BOUNDARY</div>
      <div class="tagline">AFL stats &amp; history, straight from the data</div>
    </div>
  </div>
</header>

<div class="team-strip">
  <div class="team-strip-inner" id="teamStrip"></div>
</div>

<main>
  <section class="hero">
    <div>
      <h1>Ask it anything<br/><span>on the field.</span></h1>
      <p>Head-to-head records, season stats, single-game numbers — every figure comes straight from a real tool call against the AFL dataset, not a guess.</p>
      <div class="quick-prompts" id="quickPrompts"></div>
    </div>
    <div class="mascot-wrap">
      <img src="assets/avatar.jpg" alt="AFL action" class="hero-photo" />
    </div>
  </section>

  <section class="chat-shell">
    <div class="chat-header">
      <div class="title">
        <span class="avatar-icon-wrap">
          <svg class="bot-avatar" viewBox="0 0 100 100" aria-hidden="true">
            <ellipse cx="50" cy="50" rx="34" ry="27" fill="#FFFFFF"/>
            <line x1="20" y1="50" x2="80" y2="50" stroke="#0F2A47" stroke-width="4"/>
            <line x1="32" y1="44" x2="32" y2="56" stroke="#0F2A47" stroke-width="3"/>
            <line x1="45" y1="42" x2="45" y2="58" stroke="#0F2A47" stroke-width="3"/>
            <line x1="55" y1="42" x2="55" y2="58" stroke="#0F2A47" stroke-width="3"/>
            <line x1="68" y1="44" x2="68" y2="56" stroke="#0F2A47" stroke-width="3"/>
            <circle cx="40" cy="41" r="3" fill="#0F2A47"/>
            <circle cx="60" cy="41" r="3" fill="#0F2A47"/>
          </svg>
        </span>
        BOUNDARY CHAT
      </div>
      <label class="debug-toggle">
        <input type="checkbox" id="debugToggle" />
        show tool calls
      </label>
    </div>

    <div class="messages" id="messages"></div>
    <div class="mascot-lane" id="mascotLane"></div>
    <div class="status" id="status"></div>

    <div class="composer">
      <input type="text" id="input" placeholder="e.g. Western Bulldogs vs Richmond head-to-head" autocomplete="off" />
      <button class="send-btn" id="sendBtn">
        <span>Send</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
      </button>
    </div>
  </section>
</main>

<script>
const API_URL = "http://127.0.0.1:5050/api/chat";
const HEALTH_URL = "http://127.0.0.1:5050/api/health";
let sessionId = null;
let mascotDisintegrated = true; // starts false once spawned below

const MASCOT_SVG = `<svg viewBox="0 0 240 240" aria-hidden="true">
  <g class="mascot-body">
    <ellipse cx="120" cy="130" rx="58" ry="46" fill="#1D5FB8" stroke="#0F2A47" stroke-width="5"/>
    <line x1="62" y1="130" x2="178" y2="130" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="82" y1="118" x2="82" y2="142" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="102" y1="112" x2="102" y2="148" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="138" y1="112" x2="138" y2="148" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="158" y1="118" x2="158" y2="142" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M104 146 Q120 158 136 146" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round"/>
    <line x1="70" y1="120" x2="42" y2="86" stroke="#0F2A47" stroke-width="8" stroke-linecap="round"/>
    <line x1="170" y1="120" x2="198" y2="86" stroke="#0F2A47" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g class="mascot-eyes">
    <circle cx="100" cy="112" r="7" fill="#FFFFFF"/>
    <circle cx="140" cy="112" r="7" fill="#FFFFFF"/>
    <circle cx="102" cy="113" r="3" fill="#0F2A47"/>
    <circle cx="142" cy="113" r="3" fill="#0F2A47"/>
  </g>
  <g class="mascot-boots">
    <ellipse cx="98" cy="182" rx="16" ry="9" fill="#0F2A47"/>
    <ellipse cx="142" cy="182" rx="16" ry="9" fill="#0F2A47"/>
    <line x1="100" y1="172" x2="98" y2="182" stroke="#0F2A47" stroke-width="8" stroke-linecap="round"/>
    <line x1="140" y1="172" x2="142" y2="182" stroke="#0F2A47" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>`;

function spawnMascot(){
  const lane = document.getElementById("mascotLane");
  if(!lane) return;
  mascotDisintegrated = false;
  lane.innerHTML = `<div class="mascot-visitor" id="mascotVisitor">${MASCOT_SVG}</div>`;
}

function disintegrateMascot(){
  if(mascotDisintegrated) return;
  mascotDisintegrated = true;
  const mascot = document.getElementById("mascotVisitor");
  if(!mascot) return;
  // freeze it exactly where it's currently standing, then let it fall apart there
  const rect = mascot.getBoundingClientRect();
  const parentRect = mascot.parentElement.getBoundingClientRect();
  mascot.style.left = (rect.left - parentRect.left) + "px";
  mascot.style.animation = "none";
  mascot.classList.add("disintegrate");
  setTimeout(() => mascot.remove(), 900);
}

// abbr must match a lowercase filename in assets/logos/, e.g. "RICH" -> assets/logos/rich.png
const TEAMS = [
  ["COLL", "#0A0A0A"], ["GEEL", "#1B3A6B"], ["FRE", "#3C1053"], ["WB", "#00539B"],
  ["STK", "#ED1B2E"], ["SYD", "#EF1C24"], ["HAW", "#4D2004"], ["NMFC", "#1D3557"],
  ["PORT", "#008AAB"], ["GWS", "#F57920"], ["CARL", "#00285E"], ["BL", "#7A1620"],
  ["RICH", "#FFD100"], ["WCE", "#003087"], ["GCFC", "#E2231A"], ["MELB", "#0F1131"],
  ["ESS", "#CC2229"], ["ADEL", "#002B5C"]
];

function renderTeamStrip(){
  const el = document.getElementById("teamStrip");
  el.innerHTML = TEAMS.map(([abbr,color]) => {
    const file = `assets/logos/${abbr.toLowerCase()}.png`;
    return `<div class="chip">
      <span class="dot" style="background:${color}"></span>
      <img class="team-logo-img" src="${file}" alt="${abbr} logo" style="display:none"
           onload="this.style.display='inline-block'; this.previousElementSibling.style.display='none';"
           onerror="this.remove();">
      <span>${abbr}</span>
    </div>`;
  }).join("");
}

const QUICK_PROMPTS = [
  "Western Bulldogs vs Richmond head-to-head",
  "Dustin Martin's 2017 season stats",
  "Origin of AFL as a competition"
];

function renderQuickPrompts(){
  const el = document.getElementById("quickPrompts");
  el.innerHTML = QUICK_PROMPTS.map(p => `<button class="qp-btn" data-prompt="${p}">${p}</button>`).join("");
  el.querySelectorAll(".qp-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.getElementById("input").value = btn.dataset.prompt;
      sendMessage();
    });
  });
}

function botAvatarHtml(){
  return `<span class="avatar-icon-wrap">
    <svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="34" ry="27" fill="#EAF1FB"/><line x1="20" y1="50" x2="80" y2="50" stroke="#0F2A47" stroke-width="4"/><line x1="32" y1="44" x2="32" y2="56" stroke="#0F2A47" stroke-width="3"/><line x1="45" y1="42" x2="45" y2="58" stroke="#0F2A47" stroke-width="3"/><line x1="55" y1="42" x2="55" y2="58" stroke="#0F2A47" stroke-width="3"/><line x1="68" y1="44" x2="68" y2="56" stroke="#0F2A47" stroke-width="3"/><circle cx="40" cy="41" r="3" fill="#0F2A47"/><circle cx="60" cy="41" r="3" fill="#0F2A47"/></svg>
  </span>`;
}

function addMessage(role, text, toolCalls){
  const wrap = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg " + role;

  if(role === "bot"){
    const row = document.createElement("div");
    row.className = "avatar-row";
    row.innerHTML = botAvatarHtml() + "<span class=\"label\">Boundary</span>";
    div.appendChild(row);
  }

  const body = document.createElement("div");
  body.className = "msg-body";
  if(role === "error" || typeof marked === "undefined"){
    body.textContent = text;
  }else{
    body.innerHTML = marked.parse(text);
  }
  div.appendChild(body);

  const showDebug = document.getElementById("debugToggle").checked;
  if(showDebug && toolCalls && toolCalls.length){
    const trace = document.createElement("div");
    trace.className = "tool-trace";
    trace.textContent = toolCalls.map(c => `${c.tool}(${c.input}) -> ${c.output}`).join("\n\n");
    div.appendChild(trace);
  }

  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}

async function sendMessage(){
  const input = document.getElementById("input");
  const text = input.value.trim();
  if(!text) return;

  disintegrateMascot();
  addMessage("user", text);
  input.value = "";

  const btn = document.getElementById("sendBtn");
  btn.disabled = true;
  btn.classList.add("kicking");

  try{
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text, session_id: sessionId})
    });
    const data = await res.json();
    if(!res.ok){
      addMessage("error", data.error || "Something went wrong.");
    }else{
      sessionId = data.session_id;
      addMessage("bot", data.answer, data.tool_calls);
      spawnMascot();
    }
  }catch(err){
    addMessage("error", "Can't reach the local server. Is webapp/server.py running?");
  }finally{
    btn.disabled = false;
    btn.classList.remove("kicking");
  }
}

async function checkHealth(){
  const statusEl = document.getElementById("status");
  try{
    const res = await fetch(HEALTH_URL);
    if(res.ok){
      statusEl.textContent = "";
    }else{
      throw new Error();
    }
  }catch(e){
    statusEl.textContent = "Server not running — start it with: python webapp/server.py";
    statusEl.classList.add("offline");
  }
}

document.getElementById("sendBtn").addEventListener("click", sendMessage);
